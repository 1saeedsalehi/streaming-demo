<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flight Streaming Demo</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; }
    header { margin-bottom: 1rem; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; align-items: end; }
    label { display: grid; gap: .25rem; font-size: .9rem; }
    input, button { padding: .5rem .6rem; font-size: 1rem; }
    #results { margin-top: 1rem; display: grid; gap: .5rem; }
    .card { border: 1px solid #ddd; border-radius: .5rem; padding: .75rem 1rem; }
    .muted { color: #666; font-size: .9rem; }
    .row { display: flex; justify-content: space-between; gap: 1rem; }
    code { background: #f6f8fa; padding: .2rem .3rem; border-radius: .25rem; }
  </style>
</head>
<body>
  <header>
    <h1>Improved Flight Booking – Streaming Results</h1>
    <p class="muted">Results render incrementally using NDJSON streaming.</p>
  </header>

  <form id="search-form">
    <label>From
      <input id="from" name="from" value="AMS" required />
    </label>
    <label>To
      <input id="to" name="to" value="NYC" required />
    </label>
    <label>Date
      <input id="date" name="date" type="date" value="2025-09-10" required />
    </label>
    <button type="submit">Search</button>
  </form>

  <div id="status" class="muted"></div>
  <div id="results"></div>

  <script>
    const form = document.getElementById('search-form');
    const resultsEl = document.getElementById('results');
    const statusEl = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      resultsEl.innerHTML = '';
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      const date = document.getElementById('date').value; // yyyy-mm-dd

      const url = `/api/flights/search?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&date=${encodeURIComponent(date)}`;
      statusEl.textContent = 'Searching… streaming results as they arrive…';

      try {
        const response = await fetch(url);
        if (!response.ok || !response.body) {
          throw new Error(`HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          let newlineIndex;
          while ((newlineIndex = buffer.indexOf('\n')) >= 0) {
            const line = buffer.slice(0, newlineIndex).trim();
            buffer = buffer.slice(newlineIndex + 1);
            if (!line) continue;
            try {
              const obj = JSON.parse(line);
              appendResult(obj);
            } catch (err) {
              console.error('Failed to parse line', line, err);
            }
          }
        }

        // Flush remaining buffer
        buffer = buffer.trim();
        if (buffer) {
          try { appendResult(JSON.parse(buffer)); } catch {}
        }

        statusEl.textContent = 'Completed.';
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Error: ' + err.message;
      }
    });

    function appendResult(f) {
      const div = document.createElement('div');
      debugger;
      div.className = 'card';
      div.innerHTML = `
        <div class="row"><strong>${f.provider}</strong><span>$${f.priceUsd}</span></div>
        <div class="row"><span>${f.from} → ${f.to}</span><span class="muted">${f.date}</span></div>
        <div class="muted">Flight ${f.flightNumber}</div>
      `;
      resultsEl.appendChild(div);
    }
  </script>
</body>
</html>
